name: Opengrep Test

on:
  push:
    branches:
      - opengrep-test
  pull_request:
    branches:
      - opengrep-test

jobs:
  accuknox-cicd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run OpenGrep
        uses: safeer-accuknox/opengrep-action@1.0.2
        with:
          accuknox_endpoint: "cspm.dev.accuknox.com"
          accuknox_tenant: "${{ secrets.DEV_TENANT_ID }}"
          accuknox_token: "${{ secrets.DEV_TOKEN }}"
          accuknox_label: "SPOC"
          input_soft_fail: "true"